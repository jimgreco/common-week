name: TestFlight

on:
  workflow_call:

permissions:
  contents: read


# Release guards, signing and upload come from jimgreco/release-tools (ios/),
# pinned by commit. This repository keeps only its policy
# (.github/release/release-policy.json) and the production-origin plist step.
jobs:
  build:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: jimgreco/release-tools/ios/prepare@bfd9d14bb12907b74bceaa28b7c0382fb3549ea6
        with:
          policy: .github/release/release-policy.json
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          dist-cert-p12: ${{ secrets.IOS_DIST_CERT_P12 }}
          dist-cert-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      - name: Configure production iOS origin
        run: /usr/libexec/PlistBuddy -c 'Set :API_BASE_URL https://weekofus.com' ios/CommonWeek/Info.plist
      - uses: jimgreco/release-tools/ios/upload@bfd9d14bb12907b74bceaa28b7c0382fb3549ea6
        with:
          project: ios/CommonWeek.xcodeproj
          scheme: CommonWeek
          extra-build-settings: |
            APP_PROFILE_NAME=@PROFILE_UUID:app@
            WIDGET_PROFILE_NAME=@PROFILE_UUID:extension@
      - uses: jimgreco/release-tools/ios/cleanup@bfd9d14bb12907b74bceaa28b7c0382fb3549ea6
        if: always()

  mac:
    # Same app record, certificate, audience and Git-count build as iOS, on the
    # MAC_OS train. The widgets extension is iOS-only, so the package has no appex.
    name: Mac Catalyst
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: jimgreco/release-tools/ios/prepare@bfd9d14bb12907b74bceaa28b7c0382fb3549ea6
        with:
          policy: .github/release/release-policy.json
          platform: mac
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          dist-cert-p12: ${{ secrets.IOS_DIST_CERT_P12 }}
          dist-cert-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          installer-cert-p12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          installer-cert-password: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
      - name: Configure production origin
        run: /usr/libexec/PlistBuddy -c 'Set :API_BASE_URL https://weekofus.com' ios/CommonWeek/Info.plist
      - uses: jimgreco/release-tools/ios/upload@bfd9d14bb12907b74bceaa28b7c0382fb3549ea6
        with:
          project: ios/CommonWeek.xcodeproj
          scheme: CommonWeek
          extra-build-settings: |
            PROVISIONING_PROFILE_SPECIFIER=@MAC_PROFILE_UUID:app@
      - uses: jimgreco/release-tools/ios/cleanup@bfd9d14bb12907b74bceaa28b7c0382fb3549ea6
        if: always()
