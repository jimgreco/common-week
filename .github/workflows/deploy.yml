name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy this commit (pushes to main deploy automatically)
        type: boolean
        default: false
      expected_live_build:
        description: Exact currently deployed 40-character commit (default reads /api/health)
        type: string
      recovery_evidence:
        description: Optional note; every cutover takes and verifies its own database backup first
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-common-week
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: common_week_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d common_week_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/common_week_test
      PGSSL: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node scripts/test-membership-migration.mjs
      - run: npm run db:migrate
      - run: npm run test:database
      - run: npm run test:offline-recovery
      - run: npm run test:run -- src/lib/server/notifications.integration.test.ts
        env:
          NOTIFICATION_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: python3 .github/scripts/test-deploy-app.py

  publish:
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact-commit ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            APP_BUILD=${{ github.sha }}
            NEXT_PUBLIC_APP_URL=https://weekofus.com
          cache-from: type=gha,scope=common-week-arm64
          cache-to: type=gha,mode=max,scope=common-week-arm64

  deploy:
    # Every push to main deploys once its own verify and publish jobs pass.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve live build and refuse to move production backwards
        env:
          REQUESTED_LIVE_BUILD: ${{ inputs.expected_live_build }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          live="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://weekofus.com/api/health \
            | node -e 'let t="";process.stdin.on("data",c=>t+=c).on("end",()=>{const b=JSON.parse(t);if(!/^[0-9a-f]{40}$/.test(b.build||""))process.exit(1);console.log(b.build)})')"
          if [ -n "${REQUESTED_LIVE_BUILD:-}" ] && [ "$REQUESTED_LIVE_BUILD" != "$live" ]; then
            echo "Live build is $live, not the requested $REQUESTED_LIVE_BUILD."; exit 1
          fi
          if [ "$live" = "$GITHUB_SHA" ]; then
            echo "Production already runs $GITHUB_SHA."; echo "ALREADY_LIVE=true" >> "$GITHUB_ENV"; exit 0
          fi
          # A re-run of an older push, or a hotfix deployed from another branch,
          # must never be replaced by unrelated or older code automatically.
          git merge-base --is-ancestor "$live" "$GITHUB_SHA" \
            || { echo "Live build $live is not an ancestor of $GITHUB_SHA; reconcile before deploying."; exit 1; }
          echo "EXPECTED_LIVE_BUILD=$live" >> "$GITHUB_ENV"
          echo "Deploying $GITHUB_SHA over live $live:"
          git log --oneline "$live..$GITHUB_SHA"
          git diff --name-only "$live" "$GITHUB_SHA" -- db/migrations | sed 's/^/  migration: /'
      - name: Prepare existing SSH identity
        if: env.ALREADY_LIVE != 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST" && test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS" || { echo 'Pinned host trust is not configured; use the release coordinator existing pinned SSH connection.'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/common-week"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
      - name: Deploy only Week of Us with existing live configuration
        if: env.ALREADY_LIVE != 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_LIVE_BUILD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -i "$HOME/.ssh/common-week" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$GITHUB_SHA' '$EXPECTED_LIVE_BUILD' --automatic-backup" < .github/scripts/deploy-app.sh
      - name: Verify canonical public endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 \
            https://weekofus.com/api/health | BUILD="$GITHUB_SHA" node -e '
              let text = "";
              process.stdin.on("data", (chunk) => { text += chunk; });
              process.stdin.on("end", () => {
                const body = JSON.parse(text);
                if (body.status !== "ok" || body.database !== "ready" || body.build !== process.env.BUILD) process.exit(1);
              });'
      - name: Remove runner SSH copy
        if: always()
        run: rm -f "$HOME/.ssh/common-week"
