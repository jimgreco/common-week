name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy this commit (pushes to main deploy automatically)
        type: boolean
        default: false
      expected_live_build:
        description: Exact currently deployed 40-character commit (default reads /api/health)
        type: string
      recovery_evidence:
        description: Optional note; every cutover takes and verifies its own database backup first
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-common-week
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: common_week_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d common_week_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/common_week_test
      PGSSL: "false"
    steps:
      - name: Check the requested live build
        if: inputs.expected_live_build != ''
        env:
          REQUESTED_LIVE_BUILD: ${{ inputs.expected_live_build }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_LIVE_BUILD" =~ ^[0-9a-f]{40}$ ]] || { echo 'expected_live_build must be a full commit.'; exit 1; }
          live="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://weekofus.com/api/health \
            | node -e 'let t="";process.stdin.on("data",c=>t+=c).on("end",()=>console.log(JSON.parse(t).build||""))')"
          [ "$live" = "$REQUESTED_LIVE_BUILD" ] || { echo "Live build is $live, not the requested $REQUESTED_LIVE_BUILD."; exit 1; }

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node scripts/test-membership-migration.mjs
      - run: npm run db:migrate
      - run: npm run test:database
      - run: npm run test:offline-recovery
      - run: npm run test:run -- src/lib/server/notifications.integration.test.ts
        env:
          NOTIFICATION_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

  release:
    # Every run publishes the exact-commit ARM64 image. Pushes to main, and
    # dispatches on main with deploy: true, also release it on the shared host
    # (backup, role preflight, migrations, exact-build health; see
    # .github/release/server.json and release-tools server/README.md).
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: jimgreco/release-tools/.github/workflows/server-release.yml@ff61f1c6a6eb51ea982246473203bcc903ce8153
    with:
      tools_ref: ff61f1c6a6eb51ea982246473203bcc903ce8153
      deploy: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy) }}
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}

  smoke:
    name: Verify canonical public health
    needs: release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public health reports this build with a ready database
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 \
            https://weekofus.com/api/health | BUILD="$GITHUB_SHA" node -e '
              let text = "";
              process.stdin.on("data", (chunk) => { text += chunk; });
              process.stdin.on("end", () => {
                const body = JSON.parse(text);
                if (body.status !== "ok" || body.database !== "ready" || body.build !== process.env.BUILD) process.exit(1);
              });'
