name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-week-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: common_week_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d common_week_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/common_week_test
      PGSSL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run db:migrate
      - run: npm run test:database
      - run: npm run build

  ios:
    name: iOS simulator build and unit tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Ensure we have a proper Xcode version selected
          if [[ -n "${XCODE_VERSION:-}" ]]; then
            echo "Using specified Xcode version: $XCODE_VERSION"
            # Look for the specific version
            path="/Applications/Xcode_${XCODE_VERSION}.app"
            if [ -d "$path" ]; then
              sudo xcode-select -s "$path/Contents/Developer"
              echo "Selected: $path"
              xcodebuild -version
            else
              echo "Specified Xcode version not found: $path"
              exit 1
            fi
          else
            # Try to find a working Xcode version or default to the system one
            echo "Checking for available Xcode versions..."
            for path in /Applications/Xcode_26.4.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode-26.app /Applications/Xcode.app; do
              if [ -d "$path" ]; then
                sudo xcode-select -s "$path/Contents/Developer"
                echo "Selected: $path"
                xcodebuild -version
                exit 0
              fi
            done
            
            # If no specific version found, use the system default
            echo "No specific Xcode version found, using default"
            xcodebuild -version
          fi

      - name: Run iOS tests
        run: |
          set -euo pipefail
          mkdir -p output/ci output/xcode
          
          # Ensure we have a proper simulator available
          echo "Checking for available simulators..."
          SIMULATORS=$(xcrun simctl list devices available | grep -E 'iPhone.*Shutdown|iPhone.*Booted' | head -1)
          
          if [ -z "$SIMULATORS" ]; then
            echo "No available iPhone simulator found. Creating a new one..."
            # Create a new standard simulator as fallback
            SIMULATOR_NAME="iPhone 15"
            SIMULATOR_RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-17-0"
            SIMULATOR_DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-15"
            
            echo "Creating simulator: $SIMULATOR_NAME"
            simulator_id="$(xcrun simctl create "$SIMULATOR_NAME" "$SIMULATOR_DEVICE_TYPE" "$SIMULATOR_RUNTIME" 2>&1 | grep -E '^[a-zA-Z0-9\-]+$' | head -1)"
            
            if [ -z "$simulator_id" ]; then
              echo "Failed to create simulator, trying with default options..."
              # Try simpler creation approach
              xcrun simctl create "iOS Simulator" com.apple.CoreSimulator.SimDeviceType.iPhone-15 com.apple.CoreSimulator.SimRuntime.iOS-17-0
              simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone.*com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-15/ && /(Shutdown|Booted)/ { print $2; exit }')"
            fi
            
            if [ -z "$simulator_id" ]; then
              echo "Failed to create or find simulator"
              exit 1
            fi
            
            # Boot the created simulator
            xcrun simctl boot "$simulator_id" || true
            echo "Created and booted simulator: $simulator_id"
          else
            echo "Found existing simulator(s)"
            # Use first available simulator
            simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /(Shutdown|Booted)/ { print $2; exit }')"
            if [ -z "$simulator_id" ]; then
              echo "Found simulators but none in shutdown or booted state"
              exit 1
            fi
          fi
          
          echo "Using simulator ID: $simulator_id"
          
          xcodebuild test \
            -project ios/CommonWeek.xcodeproj \
            -scheme CommonWeek \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -resultBundlePath output/xcode/CommonWeekTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee output/ci/ios-tests.log

      - name: Upload iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-diagnostics
          path: |
            output/ci/ios-tests.log
            output/xcode/CommonWeekTests.xcresult
          if-no-files-found: warn
          retention-days: 14

  testflight:
    name: TestFlight
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, ios]
    uses: ./.github/workflows/testflight.yml
    secrets: inherit
