name: CommonWeek
options:
  bundleIdPrefix: com.jimgreco
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: V6JPQCD336
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CommonWeek:
    type: application
    platform: iOS
    sources:
      - CommonWeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimgreco.commonweek
        PRODUCT_NAME: Week of Us
        PRODUCT_MODULE_NAME: CommonWeek
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CommonWeek/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommonWeek/CommonWeek.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        "TARGETED_DEVICE_FAMILY[sdk=macosx*]": "6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        "ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]": YES
        "ENABLE_RESOURCE_ACCESS_CALENDARS[sdk=macosx*]": YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_IDENTITY: Apple Distribution
    scheme:
      testTargets:
        - CommonWeekTests

  CommonWeekTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CommonWeekTests
    dependencies:
      - target: CommonWeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimgreco.commonweek.tests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Week of Us.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Week of Us"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CommonWeekScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CommonWeekScreenshots
    dependencies:
      - target: CommonWeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimgreco.commonweek.screenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CommonWeek
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
    scheme:
      testTargets:
        - CommonWeekScreenshots
