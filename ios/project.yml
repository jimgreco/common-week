name: CommonWeek
options:
  bundleIdPrefix: com.jimgreco
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: V6JPQCD336
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CommonWeek:
    type: application
    platform: iOS
    sources:
      - CommonWeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimgreco.commonweek
        PRODUCT_NAME: Week of Us
        PRODUCT_MODULE_NAME: CommonWeek
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CommonWeek/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommonWeek/CommonWeek.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - CommonWeekTests

  CommonWeekTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CommonWeekTests
    dependencies:
      - target: CommonWeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimgreco.commonweek.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Week of Us.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Week of Us"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CommonWeekScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CommonWeekScreenshots
    dependencies:
      - target: CommonWeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimgreco.commonweek.screenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CommonWeek
    scheme:
      testTargets:
        - CommonWeekScreenshots
